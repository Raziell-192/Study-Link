name: studylink
description: StudyLink — plataforma de tutorías y estudio colaborativo.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Estado (ViewModel de la capa de lógica, MVVM/Clean Architecture)
  flutter_bloc: ^8.1.5
  equatable: ^2.0.5

  # Red / API REST
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3

  # Persistencia local offline (Isar, ver AppMovil.md sección 23)
  # TEMPORALMENTE FUERA: isar_flutter_libs 3.1.0+1 no declara namespace en su
  # gradle y truena con AGP nuevo. Se vuelve a meter en la Épica 12 (offline).
  # isar: ^3.1.0+1
  # isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3

  # Sesión / token JWT
  flutter_secure_storage: ^9.2.2

  # Navegación
  go_router: ^14.2.0

  # Utilidades
  intl: ^0.19.0
  jwt_decoder: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # build_runner: ^2.4.11
  # isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
